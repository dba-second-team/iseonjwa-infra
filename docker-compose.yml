services:
  backend:
    image: ghcr.io/dba-second-team/iseonjwa-be:${BE_TAG:-latest}
    env_file: .env
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    image: ghcr.io/dba-second-team/iseonjwa-fe:${FE_TAG:-latest}
    expose:
      - "80"
    restart: unless-stopped

  gateway:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped