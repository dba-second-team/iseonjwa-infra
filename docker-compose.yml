x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  backend:
    image: ghcr.io/dba-second-team/iseonjwa-be:${BE_TAG:-latest}
    env_file: .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    expose:
      - "8080"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  frontend:
    image: ghcr.io/dba-second-team/iseonjwa-fe:${FE_TAG:-latest}
    expose:
      - "80"
    restart: unless-stopped
    logging: *default-logging

  gateway:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    logging: *default-logging